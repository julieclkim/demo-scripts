<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>WGU Secure Payment</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="student-pay-body">
  <main class="student-pay-shell">
    <section class="student-pay-card" aria-label="Secure student payment portal">
      <div class="student-pay-header">
        <div class="brand-mark" aria-hidden="true">WGU</div>
        <div>
          <p class="page-eyebrow">Secure Student Payment</p>
          <h1>Complete your payment</h1>
        </div>
      </div>

      <div class="secure-banner compact-banner">
        <span class="secure-dot" aria-hidden="true"></span>
        <div>
          <strong>Demo secure payment portal</strong>
          <span>This page is for demo purposes only. Do not enter real card or bank information.</span>
        </div>
      </div>

      <div class="portal-summary-grid compact-grid">
        <div><span>Student</span><strong id="portalStudentName">Loading</strong></div>
        <div><span>Student ID</span><strong id="portalStudentId">Loading</strong></div>
        <div><span>Payment Amount</span><strong id="portalAmount">$0.00</strong></div>
        <div><span>Confirmation</span><strong id="portalConfirmation">Pending</strong></div>
      </div>

      <form id="studentPaymentForm" class="student-payment-form">
        <label class="field-label" for="cardName">Name on card</label>
        <input id="cardName" name="cardName" type="text" autocomplete="cc-name" value="Demo Student" required>

        <label class="field-label" for="cardNumber">Card number</label>
        <input id="cardNumber" name="cardNumber" type="text" inputmode="numeric" autocomplete="cc-number" value="4111 1111 1111 1111" required>

        <div class="two-column-fields">
          <div>
            <label class="field-label" for="expiry">Expiration</label>
            <input id="expiry" name="expiry" type="text" autocomplete="cc-exp" value="12/29" required>
          </div>
          <div>
            <label class="field-label" for="cvv">CVV</label>
            <input id="cvv" name="cvv" type="text" inputmode="numeric" autocomplete="cc-csc" value="123" required>
          </div>
        </div>

        <label class="field-label" for="billingZip">Billing ZIP</label>
        <input id="billingZip" name="billingZip" type="text" inputmode="numeric" value="84107" required>

        <button class="btn success full-width" type="submit">Submit Payment</button>
      </form>

      <div class="payment-status-panel success hidden" id="studentPaymentSuccess" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/student-payment-portal.js" defer></script>
</body>
</html>
